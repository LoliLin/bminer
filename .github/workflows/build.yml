name: Build Android APK

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17 for Android SDK tools
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Java 8 for Ant build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        env:
          SKIP_JDK_VERSION_CHECK: "1"
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-8" \
            "build-tools;19.1.0" \
            "tools"

      - name: Accept licenses
        env:
          SKIP_JDK_VERSION_CHECK: "1"
        run: yes | sdkmanager --licenses

      - name: Install Ant
        run: sudo apt-get update && sudo apt-get install -y ant

      - name: Generate Ant build files
        run: |
          export PATH="$ANDROID_HOME/tools:$ANDROID_HOME/tools/bin:$PATH"
          android update project -p bminer -t android-8

      - name: Build debug APK
        run: ant debug -f bminer/build.xml

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bminer-debug-apk
          path: bminer/bin/*-debug.apk
          if-no-files-found: error
